server:
  port: 8083

spring:
  application:
    name: my-service-cards

  datasource:
    url: jdbc:postgresql://localhost:5435/my_cards_db
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
    default-schema: public
    create-schemas: true
    baseline-on-migrate: true
    baseline-version: 0

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8085/realms/my-service-realm

keycloak:
  server-url: http://localhost:8085
  realm: my-service-realm
  client-id: my-service-cards
  client-secret: b5fy4R36oAG6bXUpQK0P461P2gZeBItC

grpc:
  client:
    crypto-service:
      address: 'static://${GRPC_CLIENT_CRYPTO_HOST:localhost}:${GRPC_CLIENT_CRYPTO_PORT:50051}'
      negotiation-type: plaintext